<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>債券賽車 忠孝東路到101</title>
<style>
  :root{--navy:#0b2545;--gold:#e8c468;}
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none;}
  canvas#gl{display:block;position:fixed;inset:0;}
  #hud{position:fixed;inset:0;pointer-events:none;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.8);}
  #topbar{position:absolute;top:10px;left:10px;display:flex;gap:8px;flex-wrap:wrap;max-width:calc(100% - 200px);}
  .pill{background:rgba(11,37,69,.8);border:1px solid rgba(232,196,104,.55);border-radius:12px;padding:6px 12px;font-size:14px;white-space:nowrap;}
  .pill b{color:var(--gold);font-size:18px;}
  #minimap{position:absolute;top:10px;right:10px;width:170px;height:170px;border-radius:14px;border:2px solid rgba(232,196,104,.6);background:rgba(11,37,69,.75);}
  #guide{position:absolute;top:70px;left:50%;transform:translateX(-50%);background:rgba(20,110,60,.92);border:2px solid #fff;border-radius:12px;padding:8px 20px;font-size:22px;font-weight:700;display:none;white-space:nowrap;}
  #toast{position:absolute;top:130px;left:50%;transform:translateX(-50%);background:rgba(11,37,69,.88);border:2px solid var(--gold);border-radius:10px;padding:8px 18px;font-size:19px;opacity:0;transition:opacity .3s;white-space:nowrap;}
  #flash{position:absolute;inset:0;background:rgba(255,40,0,.38);opacity:0;transition:opacity .2s;}
  #count{position:absolute;top:38%;left:50%;transform:translate(-50%,-50%);font-size:110px;font-weight:900;color:var(--gold);text-shadow:0 4px 18px rgba(0,0,0,.8);display:none;}
  /* 駕駛座 */
  #dash{position:absolute;left:0;right:0;bottom:0;height:26vh;min-height:150px;}
  #dash .panel{position:absolute;left:0;right:0;bottom:0;height:100%;background:linear-gradient(180deg,#22252c 0%,#0e1014 70%);clip-path:polygon(0 30%,18% 12%,50% 0,82% 12%,100% 30%,100% 100%,0 100%);}
  #dash .glare{position:absolute;left:18%;right:18%;top:2%;height:3px;background:linear-gradient(90deg,transparent,rgba(232,196,104,.7),transparent);}
  #wheel{position:absolute;left:50%;bottom:-18%;width:min(46vh,62vw);height:min(46vh,62vw);transform:translateX(-50%);transform-origin:50% 50%;}
  #speedo{position:absolute;left:calc(50% + min(26vh,34vw));bottom:22%;width:118px;height:118px;border-radius:50%;background:radial-gradient(circle,#111 60%,#2a2e36);border:3px solid #444;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  #speedo b{font-size:36px;color:#fff;line-height:1;} #speedo span{font-size:12px;color:#aab;} #gear{font-size:16px;color:var(--gold);font-weight:800;}
  #dist{position:absolute;right:calc(50% + min(26vh,34vw));bottom:30%;font-size:15px;background:rgba(0,0,0,.55);border:1px solid #555;border-radius:10px;padding:8px 12px;text-align:center;}
  #dist b{display:block;font-size:24px;color:var(--gold);}
  #controls{position:fixed;inset:0;display:none;pointer-events:none;}
  #controls div{position:absolute;bottom:4vh;width:19vw;max-width:110px;height:19vw;max-height:110px;border-radius:50%;background:rgba(0,0,0,.42);border:2px solid rgba(255,255,255,.45);color:#fff;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;pointer-events:auto;}
  #cL{left:3vw;} #cR{left:calc(6vw + min(19vw,110px));}
  #cB{right:calc(6vw + min(19vw,110px));color:#ffb3b3!important;} #cG{right:3vw;color:#a8ffb8!important;}
  #controls div.on{background:rgba(232,196,104,.55);}
  .screen{position:fixed;inset:0;background:radial-gradient(ellipse at top,#163a6b,#0b2545 60%,#06162b);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;overflow:auto;z-index:5;}
  .screen h1{font-size:32px;color:var(--gold);margin-bottom:6px;}
  .screen h2{font-size:20px;color:var(--gold);margin-bottom:14px;}
  .screen p{font-size:15px;line-height:1.75;max-width:440px;color:#dbe4f0;}
  .keys{display:grid;grid-template-columns:auto auto;gap:4px 14px;text-align:left;margin:12px auto 0;font-size:14px;color:#dbe4f0;}
  .keys kbd{display:inline-block;min-width:26px;padding:2px 6px;border:1px solid var(--gold);border-radius:6px;color:var(--gold);text-align:center;margin-right:2px;}
  .btn{margin-top:18px;background:var(--gold);color:var(--navy);border:0;border-radius:12px;padding:14px 36px;font-size:18px;font-weight:700;cursor:pointer;}
  .btn:disabled{opacity:.5;cursor:default;}
  .btn.ghost{background:transparent;color:var(--gold);border:2px solid var(--gold);}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:440px;margin-top:14px;}
  .opt{background:rgba(255,255,255,.08);border:2px solid rgba(232,196,104,.5);border-radius:12px;padding:16px 10px;font-size:18px;cursor:pointer;}
  .opt.ok{background:#1e8a4c;border-color:#5fe08f;} .opt.bad{background:#9b2b2b;border-color:#ff8b8b;}
  .qnum{font-size:13px;color:#9fb3cc;margin-bottom:6px;} .qkey{font-size:26px;font-weight:700;margin-bottom:4px;}
  table{border-collapse:collapse;margin-top:12px;width:100%;max-width:440px;font-size:14px;}
  td,th{padding:6px 8px;border-bottom:1px solid rgba(255,255,255,.15);text-align:left;} th{color:var(--gold);}
  input{font-size:17px;padding:10px 14px;border-radius:10px;border:2px solid var(--gold);background:rgba(255,255,255,.08);color:#fff;width:220px;text-align:center;}
  .hidden{display:none !important;} .score{font-size:44px;color:var(--gold);font-weight:800;margin:6px 0;}
  #loadMsg{font-size:13px;color:#9fb3cc;margin-top:10px;}
</style>
</head>
<body>
<canvas id="gl"></canvas>

<div id="hud">
  <div id="topbar">
    <div class="pill">⏱ <b id="time">0.0</b> s</div>
    <div class="pill">資訊板 <b id="boards">0</b>/<span id="boardsTotal">6</span></div>
    <div class="pill">碰撞 <b id="crashes">0</b></div>
  </div>
  <canvas id="minimap" width="170" height="170"></canvas>
  <div id="guide"></div>
  <div id="toast"></div>
  <div id="flash"></div>
  <div id="count"></div>
  <div id="dash">
    <div class="panel"></div><div class="glare"></div>
    <div id="dist">距離 101<b id="distV">0.0</b>km</div>
    <svg id="wheel" viewBox="-100 -100 200 200">
      <circle r="88" fill="none" stroke="#15171c" stroke-width="20"/>
      <circle r="88" fill="none" stroke="#2c3038" stroke-width="12"/>
      <path d="M-84 6 L-30 14 L-22 40 L22 40 L30 14 L84 6" fill="none" stroke="#1d2027" stroke-width="18" stroke-linejoin="round"/>
      <circle r="26" fill="#1d2027" stroke="#3a3f49" stroke-width="3"/>
      <text y="7" text-anchor="middle" font-size="16" font-weight="800" fill="#e8c468">BOND</text>
      <rect x="-5" y="-98" width="10" height="16" rx="3" fill="#e8c468"/>
    </svg>
    <div id="speedo"><b id="spd">0</b><span>km/h</span><div id="gear">D</div></div>
  </div>
</div>
<div id="controls"><div id="cL">◀</div><div id="cR">▶</div><div id="cB">煞車</div><div id="cG">油門</div></div>

<div id="startScreen" class="screen">
  <h1>債券賽車</h1>
  <h2>忠孝東路 → 台北 101</h2>
  <p>從忠孝復興出發，沿忠孝東路往東，在<b>市府路右轉</b>開到台北 101。<br>
  路邊有 <b>6 塊債券資訊板</b>，看清楚！抵達終點後要回答剛剛看到的條件。<br>
  閃開路上的車流，撞到會扣分。</p>
  <div class="keys">
    <span><kbd>↑</kbd><kbd>W</kbd></span><span>油門</span>
    <span><kbd>↓</kbd><kbd>S</kbd></span><span>煞車／停住後倒車</span>
    <span><kbd>←</kbd><kbd>→</kbd></span><span>方向盤</span>
  </div>
  <p style="font-size:13px;margin-top:8px">手機：左下轉向、右下煞車與油門</p>
  <button class="btn" id="startBtn" disabled>城市建造中…</button>
  <div id="loadMsg"></div>
</div>

<div id="quizScreen" class="screen hidden">
  <div class="qnum" id="qnum"></div><div class="qkey" id="qkey"></div>
  <p>剛剛資訊板上寫的是？</p><div class="opts" id="opts"></div>
</div>

<div id="resultScreen" class="screen hidden">
  <h2>🏁 抵達台北 101</h2>
  <div class="score" id="finalScore"></div><p id="resultDetail"></p>
  <div id="nameBox"><input id="playerName" maxlength="12" placeholder="輸入名字上榜"><br><button class="btn" id="saveBtn">登錄排行榜</button></div>
  <table id="lb"></table>
  <button class="btn ghost" id="againBtn">再跑一次</button>
</div>

<!-- 真實街道資料：由 app.py 從 OpenStreetMap 下載後放進來；沒有資料時遊戲會自動用內建街景 -->
<script id="osmData" type="application/json">__OSM_DATA__</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* =========================================================
   ★ 設定區：換債券只需改 BOND ★
   value = 正確答案（顯示在路邊資訊板），options = 三個錯誤選項
   以下為範例數據，上線前請依實際商品條件修改
   ========================================================= */
const BOND = {
  facts: [
    { key: '發行人',   value: '德意志銀行公司債7', options: ['Apple 蘋果', 'Microsoft 微軟', 'Amazon 亞馬遜'] },
    { key: '票面利率', value: '0%',       options: ['4.25%', '2.75%', '5.00%'] },
    { key: '到期日',   value: '2031/07/20',  options: ['2029/06/15', '2031/12/15', '2034/06/15'] },
    { key: '申購價',   value: '78.26',       options: ['99.50', '101.20', '95.30'] },
    { key: '信用評等', value: 'A',         options: ['A+', 'AAA', 'BBB+'] },
    { key: '配息頻率', value: '零息債',      options: ['季配', '年配', '月配'] },
  ]
};

// 比賽路線（真實經緯度）：忠孝東路往東 → 市府路右轉往南 → 台北101
const ROUTE = [
  { name: '忠孝復興', sign: '起點 忠孝復興',            lat: 25.04163, lng: 121.54367 },
  { name: '忠孝敦化', sign: '敦化南路 Dunhua S. Rd.',   lat: 25.04148, lng: 121.54920 },
  { name: '國父紀念館', sign: '光復南路 國父紀念館',     lat: 25.04130, lng: 121.55760 },
  { name: '市府路口', sign: '市府路 右轉往 101 ➜',       lat: 25.04100, lng: 121.56250 },
  { name: '台北101',  sign: '🏁 台北101 終點',           lat: 25.03460, lng: 121.56250 },
];
const LANDMARKS = {
  t101: { lat: 25.03363, lng: 121.56450 },
  sys:  { lat: 25.04016, lng: 121.55998 },   // 國父紀念館
};

const ROAD_HALF = 11;          // 路寬一半（公尺），單向 4 線道
const LANE_W = 3.5;
const MAX_SPEED = 35;          // 公尺/秒（約 120 km/h）
const TRAFFIC_COUNT = 28;      // 路上車輛數
const LB_KEY = 'bondrace_city_lb';

/* ---------------- 座標：經緯度 → 公尺（x 往東、z 往南） ---------------- */
const ORIGIN = { lat: 25.04163, lng: 121.54367 };
const M_LAT = 110950, M_LNG = 111320 * Math.cos(25.04 * Math.PI / 180);
function L(lat, lng) { return { x: (lng - ORIGIN.lng) * M_LNG, z: -(lat - ORIGIN.lat) * M_LAT }; }

/* ---------------- 路線幾何（轉角做圓弧） ---------------- */
const RAW = ROUTE.map(p => L(p.lat, p.lng));
const PATH = [];          // 平滑後的路線點
const KEY_IDX = [0];      // 每個 ROUTE 點對應在 PATH 的位置（距離）
(function buildPath() {
  const R = 22;
  PATH.push(RAW[0]);
  for (let i = 1; i < RAW.length - 1; i++) {
    const A = RAW[i - 1], B = RAW[i], C = RAW[i + 1];
    const l1 = Math.hypot(B.x - A.x, B.z - A.z), l2 = Math.hypot(C.x - B.x, C.z - B.z);
    const u1 = { x: (B.x - A.x) / l1, z: (B.z - A.z) / l1 }, u2 = { x: (C.x - B.x) / l2, z: (C.z - B.z) / l2 };
    const cos = Math.max(-1, Math.min(1, u1.x * u2.x + u1.z * u2.z)), th = Math.acos(cos);
    const t = Math.min(R * Math.tan(th / 2), l1 * 0.4, l2 * 0.4);
    if (t < 0.5) { PATH.push(B); continue; }
    const P0 = { x: B.x - u1.x * t, z: B.z - u1.z * t }, P2 = { x: B.x + u2.x * t, z: B.z + u2.z * t };
    for (let k = 0; k <= 10; k++) {
      const s = k / 10, a = (1 - s) * (1 - s), b = 2 * (1 - s) * s, c = s * s;
      PATH.push({ x: a * P0.x + b * B.x + c * P2.x, z: a * P0.z + b * B.z + c * P2.z });
    }
  }
  PATH.push(RAW[RAW.length - 1]);
})();
const SEG = [], CUM = [0];
for (let i = 0; i < PATH.length - 1; i++) {
  const a = PATH[i], b = PATH[i + 1], len = Math.hypot(b.x - a.x, b.z - a.z) || 0.001;
  SEG.push({ a, len, dx: (b.x - a.x) / len, dz: (b.z - a.z) / len });
  CUM.push(CUM[i] + len);
}
const TOTAL = CUM[CUM.length - 1];
function project(x, z) {      // 世界座標 → 沿路距離 s、橫向偏移 lat（右側為正）
  let best = null;
  for (let i = 0; i < SEG.length; i++) {
    const g = SEG[i], px = x - g.a.x, pz = z - g.a.z;
    const t = Math.max(0, Math.min(g.len, px * g.dx + pz * g.dz));
    const qx = g.a.x + g.dx * t, qz = g.a.z + g.dz * t, d = Math.hypot(x - qx, z - qz);
    if (!best || d < best.d) best = { d, s: CUM[i] + t, lat: px * -g.dz + pz * g.dx, i };
  }
  return best;
}
function at(s) {              // 沿路距離 s → 位置、方向
  s = Math.max(0, Math.min(TOTAL - 0.001, s));
  let i = 0; while (i < SEG.length - 1 && s > CUM[i + 1]) i++;
  const g = SEG[i], t = s - CUM[i];
  return { x: g.a.x + g.dx * t, z: g.a.z + g.dz * t, dx: g.dx, dz: g.dz, rx: -g.dz, rz: g.dx, h: Math.atan2(g.dx, -g.dz) };
}
function pos(s, lat) { const p = at(s); return { x: p.x + p.rx * lat, z: p.z + p.rz * lat, p }; }
const KEY_S = RAW.map(r => project(r.x, r.z).s);
const TURN_S = KEY_S[3];

/* ---------------- Three.js 場景 ---------------- */
const canvas = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.75));
renderer.setSize(innerWidth, innerHeight);
const scene = new THREE.Scene();
const SKY = 0xbfd8ee;
scene.background = new THREE.Color(SKY);
scene.fog = new THREE.Fog(SKY, 120, 650);
const camera = new THREE.PerspectiveCamera(72, innerWidth / innerHeight, 0.3, 4000);
scene.add(new THREE.HemisphereLight(0xffffff, 0x667788, 0.85));
const sun = new THREE.DirectionalLight(0xfff4e0, 0.75); sun.position.set(-300, 500, 200); scene.add(sun);
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

function setMsg(t) { document.getElementById('loadMsg').textContent = t; }

// 地面
const ground = new THREE.Mesh(new THREE.PlaneGeometry(9000, 9000), new THREE.MeshLambertMaterial({ color: 0x8d918c }));
ground.rotation.x = -Math.PI / 2; ground.position.set(1000, -0.05, 300); scene.add(ground);

// 合併幾何工具：一次加很多四邊形，最後變成一個 mesh（效能好）
function QuadBatch() { this.p = []; this.c = []; this.uv = []; }
QuadBatch.prototype.tri = function (a, b, c, col, ua, ub, uc) {
  this.p.push(a[0], a[1], a[2], b[0], b[1], b[2], c[0], c[1], c[2]);
  for (let i = 0; i < 3; i++) this.c.push(col[0], col[1], col[2]);
  if (ua) this.uv.push(ua[0], ua[1], ub[0], ub[1], uc[0], uc[1]); else this.uv.push(0, 0, 0, 0, 0, 0);
};
QuadBatch.prototype.quad = function (a, b, c, d, col, uvs) {  // a-b-c-d 逆時針（從正面看）
  const u = uvs || [[0, 0], [1, 0], [1, 1], [0, 1]];
  this.tri(a, b, c, col, u[0], u[1], u[2]); this.tri(a, c, d, col, u[0], u[2], u[3]);
};
QuadBatch.prototype.mesh = function (mat) {
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(this.p, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(this.c, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(this.uv, 2));
  g.computeVertexNormals();
  return new THREE.Mesh(g, mat);
};
function ribbon(batch, pts, half, y, col) {   // 沿折線畫一條平面帶子
  for (let i = 0; i < pts.length - 1; i++) {
    const a = pts[i], b = pts[i + 1], l = Math.hypot(b.x - a.x, b.z - a.z); if (l < 0.01) continue;
    const nx = -(b.z - a.z) / l * half, nz = (b.x - a.x) / l * half;
    const ext = Math.min(half, 3) / l, ex = (b.x - a.x) * ext, ez = (b.z - a.z) * ext;
    batch.quad([a.x - nx - ex, y, a.z - nz - ez], [a.x + nx - ex, y, a.z + nz - ez], [b.x + nx + ex, y, b.z + nz + ez], [b.x - nx + ex, y, b.z - nz + ez], col);
  }
}

// 窗戶貼圖
function windowTexture() {
  const c = document.createElement('canvas'); c.width = 128; c.height = 128;
  const g = c.getContext('2d');
  g.fillStyle = '#e9e6e0'; g.fillRect(0, 0, 128, 128);
  for (let y = 0; y < 2; y++) for (let x = 0; x < 2; x++) {
    const lit = Math.random() < 0.25;
    g.fillStyle = lit ? '#fff1c2' : '#4d5d70'; g.fillRect(x * 64 + 10, y * 64 + 14, 44, 38);
    g.fillStyle = 'rgba(255,255,255,.18)'; g.fillRect(x * 64 + 10, y * 64 + 14, 44, 6);
  }
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 4; return t;
}
const PALETTE = [[0.86, 0.84, 0.80], [0.78, 0.76, 0.72], [0.70, 0.72, 0.75], [0.88, 0.82, 0.74], [0.62, 0.64, 0.66], [0.80, 0.70, 0.62], [0.74, 0.80, 0.82]];

// 由多邊形蓋大樓（外牆＋屋頂），pts 為 [{x,z}]
function addBuilding(walls, roofs, pts, h, col) {
  let area = 0;
  for (let i = 0; i < pts.length; i++) { const a = pts[i], b = pts[(i + 1) % pts.length]; area += a.x * b.z - b.x * a.z; }
  if (Math.abs(area) < 8) return;
  if (area > 0) pts = pts.slice().reverse();   // 統一方向，讓外牆朝外
  let u = 0;
  const vTop = h / 3.4;
  for (let i = 0; i < pts.length; i++) {
    const a = pts[i], b = pts[(i + 1) % pts.length], l = Math.hypot(b.x - a.x, b.z - a.z);
    if (l < 0.05) continue;
    const u2 = u + l / 4.2;
    walls.quad([a.x, 0, a.z], [b.x, 0, b.z], [b.x, h, b.z], [a.x, h, a.z], col, [[u, 0], [u2, 0], [u2, vTop], [u, vTop]]);
    u = u2;
  }
  const v2 = pts.map(p => new THREE.Vector2(p.x, p.z));
  let tris; try { tris = THREE.ShapeUtils.triangulateShape(v2, []); } catch (e) { tris = []; }
  const rc = [col[0] * 0.8, col[1] * 0.8, col[2] * 0.8];
  for (const t of tris) {
    const A = pts[t[0]], B = pts[t[1]], C = pts[t[2]];
    // 屋頂朝上

  g.userData = { halfL: L2 / 2, halfW: W2 / 2 };
  return g;
}
const LANES_FWD = [LANE_W * 0.5, LANE_W * 1.5, LANE_W * 2.5], LANES_BACK = [-LANE_W * 0.5, -LANE_W * 1.5, -LANE_W * 2.5];
function spawnCar(c, nearS, initial) {
  c.dir = Math.random() < 0.55 ? 1 : -1;
  const lanes = c.dir > 0 ? LANES_FWD : LANES_BACK;
  c.lane = lanes[Math.floor(Math.random() * 3)];
  c.vmax = c.kind === 'bus' ? 9 + Math.random() * 3 : 11 + Math.random() * 7;
  c.v = c.vmax;
  if (initial) c.s = 40 + Math.random() * (TOTAL - 80);
  else c.s = nearS + 220 + Math.random() * 280;
  c.hitCd = 0;
  c.active = c.s < TOTAL - 40;          // 快到終點時不再生車，避免車子突然出現在面前
  c.mesh.visible = c.active;
}
function buildTraffic() {
  for (let i = 0; i < TRAFFIC_COUNT; i++) {
    const kind = i % 9 === 0 ? 'bus' : (Math.random() < 0.3 ? 'taxi' : 'car');
    const c = { kind, mesh: makeCar(kind) };
    spawnCar(c, 0, true);
    if (c.dir > 0 && c.s < 60 && Math.abs(c.lane - LANE_W * 1.5) < 2) c.s += 120;
    scene.add(c.mesh); TRAFFIC.push(c);
  }
}
function updateTraffic(dt) {
  for (const c of TRAFFIC) {
    if (!c.active) continue;
    // 跟車：同車道前方有車就減速
    let target = c.vmax;
    for (const o of TRAFFIC) {
      if (o === c || !o.active || o.lane !== c.lane) continue;
      const gap = (o.s - c.s) * c.dir;
      if (gap > 0 && gap < 16 + c.mesh.userData.halfL + o.mesh.userData.halfL) target = Math.min(target, o.v * 0.9);
    }
    // 玩家在前方同車道也會減速
    const pg = (car.s - c.s) * c.dir;
    if (pg > 0 && pg < 14 && Math.abs(car.lat - c.lane) < 2.2) target = Math.min(target, Math.max(0, car.speed * 0.8));
    c.v += Math.max(-8 * dt, Math.min(3 * dt, target - c.v));
    c.s += c.v * c.dir * dt;
    c.hitCd = Math.max(0, c.hitCd - dt);
    if (c.s > TOTAL + 5 || c.s < -5 || (c.s - car.s) < -160 || (c.s - car.s) > 700) spawnCar(c, car.s, false);
    const p = pos(c.s, c.lane);
    c.mesh.position.set(p.x, 0, p.z);
    c.mesh.rotation.y = -(p.p.h + (c.dir < 0 ? Math.PI : 0));
    c.wx = p.x; c.wz = p.z; c.hx = p.p.dx * c.dir; c.hz = p.p.dz * c.dir;
  }
}

/* ---------------- 玩家車輛 ---------------- */
const car = { x: 0, z: 0, h: 0, speed: 0, steer: 0, s: 0, lat: 0, curbCd: 0 };
function resetCar() {
  const p = pos(12, LANE_W * 1.5);
  car.x = p.x; car.z = p.z; car.h = p.p.h; car.speed = 0; car.steer = 0; car.s = 12; car.lat = LANE_W * 1.5; car.curbCd = 0;
}
const keys = {}; const touch = { L: false, R: false, B: false, G: false };
addEventListener('keydown', e => { keys[e.code] = true; if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault(); });
addEventListener('keyup', e => { keys[e.code] = false; });
function updateCar(dt) {
  const gas = keys.ArrowUp || keys.KeyW || touch.G;
  const brake = keys.ArrowDown || keys.KeyS || keys.Space || touch.B;
  let steerIn = 0;
  if (keys.ArrowLeft || keys.KeyA || touch.L) steerIn -= 1;
  if (keys.ArrowRight || keys.KeyD || touch.R) steerIn += 1;
  car.steer += (steerIn - car.steer) * Math.min(1, (steerIn ? 4 : 6) * dt);

  if (gas) car.speed += (car.speed < 0 ? 16 : 7.5 * (1 - car.speed / (MAX_SPEED * 1.05))) * dt;
  else if (brake) car.speed += (car.speed > 0.3 ? -15 : -4.5) * dt;      // 停住後再按 = 倒車
  else car.speed -= Math.sign(car.speed) * Math.min(Math.abs(car.speed), (0.8 + 0.004 * car.speed * car.speed) * dt);
  car.speed = Math.max(-7, Math.min(MAX_SPEED, car.speed));

  const v = car.speed, grip = Math.min(1, Math.abs(v) / 4);
  const yaw = car.steer * (1.25 / (1 + Math.abs(v) / 16)) * grip * Math.sign(v || 1);
  car.h += yaw * dt;
  car.x += Math.sin(car.h) * v * dt; car.z += -Math.cos(car.h) * v * dt;

  const pr = project(car.x, car.z);
  car.s = pr.s; car.lat = pr.lat;
  car.curbCd = Math.max(0, car.curbCd - dt);
  const LIM = ROAD_HALF + 3.6;
  if (Math.abs(pr.lat) > LIM) {     // 撞到路緣：推回來並減速
    const back = pos(pr.s, Math.sign(pr.lat) * LIM);
    car.x = back.x; car.z = back.z;
    if (car.curbCd <= 0 && Math.abs(car.speed) > 6) { toast('撞到路邊！'); shake = 0.35; car.curbCd = 1; }
    car.speed *= Math.pow(0.15, dt);
  }
  if (car.s < 1 && car.speed < 0) car.speed = 0;
  // 與車流碰撞
  for (const c of TRAFFIC) {
    if (!c.active) continue;
    const rx = car.x - c.wx, rz = car.z - c.wz;
    const f = rx * c.hx + rz * c.hz, r = rx * -c.hz + rz * c.hx;
    if (Math.abs(f) < c.mesh.userData.halfL + 2.1 && Math.abs(r) < c.mesh.userData.halfW + 0.95 && c.hitCd <= 0) {
      c.hitCd = 1.5; crashes++;
      document.getElementById('crashes').textContent = crashes;
      const rel = car.speed;
      car.speed = -Math.sign(rel || 1) * Math.min(4, Math.abs(rel) * 0.3);
      c.v *= 0.3;
      const fl = document.getElementById('flash'); fl.style.opacity = 1; setTimeout(() => fl.style.opacity = 0, 220);
      shake = 0.6; toast('碰撞！−200 分');
    }
  }
}

/* ---------------- 小地圖 ---------------- */
const mm = document.getElementById('minimap'), mctx = mm.getContext('2d');
let MM = null;
function setupMinimap() {
  let x0 = Infinity, x1 = -Infinity, z0 = Infinity, z1 = -Infinity;
  PATH.forEach(p => { x0 = Math.min(x0, p.x); x1 = Math.max(x1, p.x); z0 = Math.min(z0, p.z); z1 = Math.max(z1, p.z); });
  const p101 = L(LANDMARKS.t101.lat, LANDMARKS.t101.lng); x1 = Math.max(x1, p101.x); z1 = Math.max(z1, p101.z);
  const pad = 14, sc = Math.min((170 - pad * 2) / (x1 - x0), (170 - pad * 2) / (z1 - z0));
  MM = { sc, ox: pad - x0 * sc + ((170 - pad * 2) - (x1 - x0) * sc) / 2, oz: pad - z0 * sc + ((170 - pad * 2) - (z1 - z0) * sc) / 2, p101 };
}
function drawMinimap() {
  const m = MM, X = x => m.ox + x * m.sc, Z = z => m.oz + z * m.sc;
  mctx.clearRect(0, 0, 170, 170);
  mctx.lineCap = 'round'; mctx.lineJoin = 'round';
  mctx.strokeStyle = 'rgba(255,255,255,.35)'; mctx.lineWidth = 7; mctx.beginPath();
  PATH.forEach((p, i) => i ? mctx.lineTo(X(p.x), Z(p.z)) : mctx.moveTo(X(p.x), Z(p.z))); mctx.stroke();
  mctx.strokeStyle = '#e8c468'; mctx.lineWidth = 3; mctx.beginPath();
  PATH.forEach((p, i) => i ? mctx.lineTo(X(p.x), Z(p.z)) : mctx.moveTo(X(p.x), Z(p.z))); mctx.stroke();
  for (const b of BOARDS) { mctx.fillStyle = b.seen ? '#5fe08f' : '#ffffff'; mctx.fillRect(X(b.x) - 2.5, Z(b.z) - 2.5, 5, 5); }
  mctx.font = '16px sans-serif'; mctx.textAlign = 'center'; mctx.fillText('🏁', X(m.p101.x), Z(m.p101.z) + 6);
  mctx.save(); mctx.translate(X(car.x), Z(car.z)); mctx.rotate(car.h);
  mctx.fillStyle = '#ff5a4f'; mctx.beginPath(); mctx.moveTo(0, -7); mctx.lineTo(5, 5); mctx.lineTo(-5, 5); mctx.closePath(); mctx.fill();
  mctx.restore();
}

/* ---------------- 遊戲流程 ---------------- */
let state = 'loading', startTime = 0, elapsed = 0, crashes = 0, boardsSeen = 0, shake = 0, countT = 0;
function toast(msg) {
  const t = document.getElementById('toast'); t.textContent = msg; t.style.opacity = 1;
  clearTimeout(t._h); t._h = setTimeout(() => t.style.opacity = 0, 1400);
}
function startRace() {
  resetCar(); crashes = 0; boardsSeen = 0; elapsed = 0;
  BOARDS.forEach(b => b.seen = false);
  TRAFFIC.forEach(c => { spawnCar(c, 0, true); if (c.s < 70 && c.dir > 0) c.s += 150; });
  document.getElementById('boards').textContent = 0; document.getElementById('crashes').textContent = 0;
  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('resultScreen').classList.add('hidden');
  state = 'count'; countT = 3.2;
  canvas.focus && canvas.focus();
}
let qIndex = 0, correct = 0, raceTime = 0;
let finT = 0;
function finishRace() {
  state = 'finish'; raceTime = elapsed; finT = 0;
  document.getElementById('guide').style.display = 'none';
  toast('🏁 抵達台北101！準備答題');
}
function openQuiz() {
  state = 'quiz'; qIndex = 0; correct = 0;
  document.getElementById('quizScreen').classList.remove('hidden'); showQuestion();
}
function showQuestion() {
  const f = BOND.facts[qIndex];
  document.getElementById('qnum').textContent = `第 ${qIndex + 1} / ${BOND.facts.length} 題 ・ 跑完時間 ${raceTime.toFixed(1)} 秒`;
  document.getElementById('qkey').textContent = f.key;
  const opts = [f.value, ...f.options].sort(() => Math.random() - 0.5);
  const box = document.getElementById('opts'); box.innerHTML = ''; let answered = false;
  opts.forEach(o => {
    const b = document.createElement('div'); b.className = 'opt'; b.textContent = o;
    b.onclick = () => {
      if (answered) return; answered = true;
      if (o === f.value) { b.classList.add('ok'); correct++; }
      else { b.classList.add('bad'); [...box.children].find(x => x.textContent === f.value).classList.add('ok'); }
      setTimeout(() => { qIndex++; qIndex < BOND.facts.length ? showQuestion() : showResult(); }, 900);
    };
    box.appendChild(b);
  });
}
function calcScore() { return Math.max(0, Math.round(correct * 1000 - raceTime * 5 - crashes * 200)); }
function showResult() {
  state = 'result';
  document.getElementById('quizScreen').classList.add('hidden');
  document.getElementById('resultScreen').classList.remove('hidden');
  document.getElementById('finalScore').textContent = calcScore() + ' 分';
  document.getElementById('resultDetail').innerHTML =
    `答對 <b>${correct}/${BOND.facts.length}</b> 題（每題 +1000）<br>時間 ${raceTime.toFixed(1)} 秒（每秒 −5）<br>碰撞 ${crashes} 次（每次 −200）`;
  document.getElementById('nameBox').classList.remove('hidden'); renderLB();
}
function loadLB() { try { return JSON.parse(localStorage.getItem(LB_KEY)) || []; } catch (e) { return []; } }
function renderLB() {
  const lb = loadLB().sort((a, b) => b.score - a.score).slice(0, 10);
  document.getElementById('lb').innerHTML = '<tr><th>#</th><th>名字</th><th>分數</th><th>答對</th><th>秒</th></tr>' +
    lb.map((r, i) => `<tr><td>${i + 1}</td><td>${String(r.name).replace(/</g, '&lt;')}</td><td>${r.score}</td><td>${r.correct}</td><td>${r.time}</td></tr>`).join('');
}
document.getElementById('saveBtn').onclick = () => {
  const name = document.getElementById('playerName').value.trim() || '匿名';
  const lb = loadLB(); lb.push({ name, score: calcScore(), correct, time: raceTime.toFixed(1) });
  try { localStorage.setItem(LB_KEY, JSON.stringify(lb)); } catch (e) {}
  document.getElementById('nameBox').classList.add('hidden'); renderLB();
};
document.getElementById('startBtn').onclick = startRace;
document.getElementById('againBtn').onclick = startRace;

// 手機按鈕
if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
  document.getElementById('controls').style.display = 'block';
  for (const [id, k] of [['cL', 'L'], ['cR', 'R'], ['cB', 'B'], ['cG', 'G']]) {
    const el = document.getElementById(id);
    const on = e => { e.preventDefault(); touch[k] = true; el.classList.add('on'); };
    const off = e => { e.preventDefault(); touch[k] = false; el.classList.remove('on'); };
    el.addEventListener('touchstart', on, { passive: false }); el.addEventListener('touchend', off, { passive: false });
    el.addEventListener('touchcancel', off); el.addEventListener('pointerdown', on); el.addEventListener('pointerup', off); el.addEventListener('pointerleave', off);
  }
}

/* ---------------- 主迴圈 ---------------- */
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min((now - last) / 1000, 0.05); last = now;
  if (state === 'count') {
    countT -= dt;
    const el = document.getElementById('count'); el.style.display = 'block';
    el.textContent = countT > 2.2 ? '3' : countT > 1.2 ? '2' : countT > 0.2 ? '1' : 'GO!';
    if (countT <= -0.4) { el.style.display = 'none'; state = 'play'; startTime = performance.now(); }
  }
  if (state === 'play' || state === 'count') updateTraffic(dt);
  if (state === 'play') {
    updateCar(dt);
    elapsed = (performance.now() - startTime) / 1000;
    for (const b of BOARDS) if (!b.seen && car.s > b.s + 5) { b.seen = true; boardsSeen++; document.getElementById('boards').textContent = boardsSeen; }
    const g = document.getElementById('guide'), toTurn = TURN_S - car.s;
    if (toTurn > 0 && toTurn < 260) { g.style.display = 'block'; g.textContent = `↱ ${Math.round(toTurn)} m 後右轉 市府路`; }
    else if (car.s > TURN_S + 30 && TOTAL - car.s < 200) { g.style.display = 'block'; g.textContent = '🏁 終點就在前方！'; }
    else {
      const d = at(car.s), fwd = Math.sin(car.h) * d.dx + -Math.cos(car.h) * d.dz;
      if (fwd < -0.3 && Math.abs(car.speed) > 2) { g.style.display = 'block'; g.textContent = '⚠ 方向錯誤，請迴轉'; }
      else g.style.display = 'none';
    }
    if (car.s >= TOTAL - 8) finishRace();
  }
  if (state === 'finish') {
    finT += dt;
    car.speed = Math.max(0, car.speed - 14 * dt);
    car.x += Math.sin(car.h) * car.speed * dt; car.z += -Math.cos(car.h) * car.speed * dt;
    if (finT > 3.2) openQuiz();
  }
  // 鏡頭：駕駛座視角
  shake = Math.max(0, shake - dt);
  const sx = (Math.random() - 0.5) * shake * 0.5, sy = (Math.random() - 0.5) * shake * 0.4;
  const fx = Math.sin(car.h), fz = -Math.cos(car.h);
  camera.position.set(car.x + fx * 0.3 + sx, 1.25 + sy + Math.sin(now / 90) * 0.012 * Math.min(1, car.speed / 10), car.z + fz * 0.3);
  if (state === 'finish' || state === 'quiz' || state === 'result') {
    const t = Math.min(1, finT / 1.8), e = t * t * (3 - 2 * t), T = L(LANDMARKS.t101.lat, LANDMARKS.t101.lng);
    camera.lookAt(car.x + fx * 20 + (T.x - car.x - fx * 20) * e, 1.15 + 260 * e, car.z + fz * 20 + (T.z - car.z - fz * 20) * e);
  } else {
    camera.lookAt(car.x + fx * 20, 1.15, car.z + fz * 20);
    camera.rotateZ(-car.steer * 0.025);
  }
  const fov = 72 + Math.max(0, car.speed) * 0.35;
  if (Math.abs(camera.fov - fov) > 0.2) { camera.fov = fov; camera.updateProjectionMatrix(); }
  // 儀表
  document.getElementById('wheel').style.transform = `translateX(-50%) rotate(${car.steer * 110}deg)`;
  document.getElementById('spd').textContent = Math.round(Math.abs(car.speed) * 3.6);
  document.getElementById('gear').textContent = car.speed < -0.3 ? 'R' : 'D';
  document.getElementById('time').textContent = elapsed.toFixed(1);
  document.getElementById('distV').textContent = Math.max(0, (TOTAL - car.s) / 1000).toFixed(2);
  if (MM) drawMinimap();
  renderer.render(scene, camera);
}

/* ---------------- 啟動 ---------------- */
setTimeout(() => {
  try {
    planBoards();
    const src = buildCity();
    buildRoad(); build101(); buildSYS(); buildBoards(); buildGantries(); buildTraffic();
    setupMinimap(); resetCar();
    document.getElementById('boardsTotal').textContent = BOND.facts.length;
    setMsg(`地圖來源：${src}・全程約 ${(TOTAL / 1000).toFixed(1)} 公里`);
    const btn = document.getElementById('startBtn'); btn.disabled = false; btn.textContent = '🏁 出發';
    state = 'ready';
  } catch (e) { console.error(e); setMsg('建造城市時發生錯誤：' + e.message); }
  requestAnimationFrame(frame);
}, 30);
</script>
</body>
